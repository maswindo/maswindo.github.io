<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intel Tableau Visualization</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="container">
        <a href="index.html" class="button">⬅ Back to Home</a>
        <h1>Interactive Tableau Visualization</h1>
        <p>Explore Intel's energy usage through an interactive Tableau dashboard embedded below:</p>

        <div class='tableauPlaceholder' id='viz1723115488789'>
            <noscript>
                <a href='#'>
                    <img alt='Dashboard' src='https://public.tableau.com/static/images/Ma/MasonHotaling_IntelProject-Tabealu/Dashboard/1_rss.png' style='border: none' />
                </a>
            </noscript>
            <object class='tableauViz' style='display:none;'>
                <param name='host_url' value='https%3A%2F%2Fpublic.tableau.com%2F' />
                <param name='embed_code_version' value='3' />
                <param name='site_root' value='' />
                <param name='name' value='MasonHotaling_IntelProject-Tabealu/Dashboard' />
                <param name='tabs' value='no' />
                <param name='toolbar' value='yes' />
                <param name='static_image' value='https://public.tableau.com/static/images/Ma/MasonHotaling_IntelProject-Tabealu/Dashboard/1.png' />
                <param name='animate_transition' value='yes' />
                <param name='display_static_image' value='yes' />
                <param name='display_spinner' value='yes' />
                <param name='display_overlay' value='yes' />
                <param name='display_count' value='yes' />
                <param name='language' value='en-US' />
                <param name='filter' value='publish=yes' />
            </object>
        </div>

        <script type='text/javascript'>
            var divElement = document.getElementById('viz1723115488789');
            var vizElement = divElement.getElementsByTagName('object')[0];
            vizElement.style.width='100%';
            vizElement.style.height='827px';
            var scriptElement = document.createElement('script');
            scriptElement.src = 'https://public.tableau.com/javascripts/api/viz_v1.js';
            vizElement.parentNode.insertBefore(scriptElement, vizElement);
        </script>

        <footer>
            <p>📫 Contact: <a href="mailto:mjhotaling@proton.me">mjhotaling@proton.me</a> | <a href="https://github.com/maswindo" target="_blank">GitHub</a></p>
        </footer>
    </div>
</body>
</html>
